server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every non-file route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API (incl. the Google OAuth flow) to the backend container.
  # Resolved at request time (not config-load time) via the variable, so
  # nginx still starts even if "server" can't be resolved (e.g. when the
  # client is deployed standalone and talks to the API via VITE_API_URL
  # instead, leaving this location unused).
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $upstream_server http://server:4000;
    proxy_pass $upstream_server;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
